<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tableau de bord — Chapitre 6 : Tensions continues et alternatives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0D488D;--sky:#1FA2DC;--plum:#501750;--magenta:#8C2A78;--sun:#F2B705;
  --ink:#1C2A3B;--muted:#56657A;--paper:#F2F5F9;--card:#FFFFFF;--line:#D8DEE6;--soft:#E8EEF5;
  --ok:#1C7A43;--ok-bg:#DDF1E5;--prog:#E39B00;--prog-bg:#FFF1CC;--bad:#B1261C;--bad-bg:#FBE1DE;--none:#E4E9EF;
  --accent:#0D488D;--accent-ink:#fff;
  --serif:"Source Serif 4",Cambria,Georgia,serif;--sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E6ECF3;--muted:#A3B2C4;--paper:#0E1622;--card:#16212F;--line:#2A394C;--soft:#1C2A3B;
  --ok:#62D195;--ok-bg:#163A27;--prog:#F2C94C;--prog-bg:#3A3015;--bad:#FF8F84;--bad-bg:#3E1E1B;--none:#233244;--accent:#5C9BE6;--accent-ink:#0B1420;color-scheme:dark;}}
:root[data-theme="dark"]{--ink:#E6ECF3;--muted:#A3B2C4;--paper:#0E1622;--card:#16212F;--line:#2A394C;--soft:#1C2A3B;
  --ok:#62D195;--ok-bg:#163A27;--prog:#F2C94C;--prog-bg:#3A3015;--bad:#FF8F84;--bad-bg:#3E1E1B;--none:#233244;--accent:#5C9BE6;--accent-ink:#0B1420;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;}
button,input,select{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;}
.top{background:#fff;color:#1C2A3B;border-bottom:1px solid #DCE2EA;}
.top::after{content:"";display:block;height:4px;background:linear-gradient(90deg,#1FA2DC,#0D488D 35%,#501750 65%,#8C2A78 85%,#F2B705);}
.top-in{max-width:1500px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;}
.top .l1{height:38px;width:auto;}.top .l2{height:44px;width:auto;margin-left:auto;}
.top h1{font-family:var(--serif);font-size:1.15rem;margin:0;line-height:1.2;}
.top h1 span{display:block;font-family:var(--sans);font-weight:400;font-size:.85rem;color:#56657A;}
main{max-width:1500px;margin:0 auto;padding:16px 16px 60px;}
.btn{border:none;border-radius:10px;padding:9px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:400;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;}
.login{max-width:440px;margin:60px auto;}
.login h2{font-family:var(--serif);margin:0 0 8px;}
.login input[type=password]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);margin:8px 0;}
.err{color:var(--bad);font-weight:700;}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px;}
.bar select,.bar input[type=search]{padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);}
.bar .sp{flex:1;}
.upd{color:var(--muted);font-size:.9rem;}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;width:max-content;max-width:100%;flex-wrap:wrap;}
.tabs button{border:none;background:transparent;border-radius:10px;padding:8px 14px;cursor:pointer;}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;}
.kpi b{display:block;font-family:var(--serif);font-size:1.7rem;color:var(--accent);line-height:1.1;}
.kpi span{font-size:.88rem;color:var(--muted);}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.88rem;color:var(--muted);margin:8px 0;}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;}
table{border-collapse:collapse;width:100%;font-size:.92rem;}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;}
th{font-weight:700;color:var(--muted);background:var(--card);position:sticky;top:0;z-index:1;}
td.nm,th.nm{text-align:left;position:sticky;left:0;background:var(--card);z-index:2;min-width:170px;}
th.nm{z-index:3;}
td.nm button{border:none;background:none;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:left;}
td.nm small{display:block;color:var(--muted);font-weight:400;}
.c{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;font-weight:700;font-size:.85rem;}
.c.none{background:var(--none);color:transparent;}
.c.prog{background:var(--prog-bg);color:var(--prog);border:1.5px solid var(--prog);}
.c.ok{background:var(--ok);color:#fff;}
.c.stuck{background:var(--bad);color:#fff;}
th.sec{min-width:34px;}
th.sep,td.sep{border-left:2px solid var(--line);}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:5px;}
.qt td{text-align:left;white-space:normal;vertical-align:top;}
.qt td.n{text-align:center;white-space:nowrap;}
.qt .sh{background:var(--soft);font-weight:700;color:var(--plum);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qt .sh{color:#D79ACB;}}
.pbar{display:inline-block;width:90px;height:9px;border-radius:5px;background:var(--soft);overflow:hidden;vertical-align:middle;margin-right:6px;}
.pbar i{display:block;height:100%;border-radius:5px;}
.errs{margin:0;padding-left:1.1em;color:var(--muted);font-size:.86rem;}
.tbar{position:relative;height:14px;border-radius:7px;background:var(--soft);min-width:160px;}
.tbar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--sky);}
.tbar b{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--plum);border-radius:2px;}
.empty{padding:28px;text-align:center;color:var(--muted);}
dialog{border:none;border-radius:18px;padding:0;max-width:760px;width:calc(100vw - 24px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);}
dialog::backdrop{background:rgba(10,18,30,.55);}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);}
.dh h2{font-family:var(--serif);margin:0;font-size:1.4rem;}
.db{padding:14px 20px 20px;max-height:70vh;overflow:auto;}
.sd{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;}
.sd h3{margin:0 0 6px;font-size:1rem;display:flex;align-items:center;gap:8px;}
.sd ul{margin:0;padding-left:1.1em;font-size:.9rem;}
.sd li{margin:3px 0;}
tr.ns td{color:var(--muted);}
tr.ns .nn{font-weight:400;}
.tag.warn{background:var(--prog-bg);color:var(--prog);}
.tag{display:inline-block;font-size:.78rem;padding:1px 8px;border-radius:20px;background:var(--soft);color:var(--muted);margin-left:4px;}
.setup{max-width:720px;margin:40px auto;}
code{background:var(--soft);padding:1px 6px;border-radius:6px;}
@media print{.top,.bar,.tabs{display:none;}}
</style>
</head>

  const rows = ROWS.filter(r => r.detail && r.detail.id);
  const make = r => {
    const m = match(r), x = m && m.x;
    return { r, d: r.detail, classe: x ? x.classe : r.classe, nom: x ? x.nom : r.nom, prenom: x ? x.prenom : r.prenom,
      key: x ? rkey(x) : 'libre|' + r.classe + '|' + norm(r.name), flag: !LISTE.length ? '' : !m ? 'unlisted' : m.other ? 'other' : m.exact ? '' : 'fuzzy', typed: r.name, typedClasse: r.classe };
  };
  if (UI.mode === 'all') rows.forEach(r => entries.push(make(r)));
  else {
    const best = {};
    rows.forEach(r => { const e = make(r); if (!best[e.key] || (e.d.updated || 0) > (best[e.key].d.updated || 0)) best[e.key] = e; });
    Object.values(best).forEach(e => { entries.push(e); seen.add(e.key); });
    LISTE.forEach(x => { if (!seen.has(rkey(x))) entries.push({ r: null, d: null, classe: x.classe, nom: x.nom, prenom: x.prenom, key: rkey(x), flag: 'none' }); });
  }
  return entries
    .filter(e => (!UI.classe || e.classe === UI.classe) && (!q || norm(e.prenom + ' ' + e.nom + ' ' + (e.typed || '')).includes(q)))
    .sort((a, b) => a.classe.localeCompare(b.classe) || norm(a.nom).localeCompare(norm(b.nom)) || norm(a.prenom).localeCompare(norm(b.prenom)) || ((a.d && a.d.n) || 0) - ((b.d && b.d.n) || 0));
}
const withData = list => list.filter(e => e.d);
const nameHTML = e => `<b>${esc(e.nom)}</b> ${esc(e.prenom)}`;
const noteHTML = e => e.flag === 'fuzzy' ? ` · a écrit « ${esc(e.typed)} »` : e.flag === 'other' ? ` · a choisi ${esc(e.typedClasse)}` : e.flag === 'unlisted' ? ' <span class="tag warn">absent de la liste</span>' : e.flag === 'none' ? ' · pas encore connecté' : '';
function secData(d, s) { return s.kind === 'st' ? (d.st || {})[s.id] : s.kind === 'ex' ? (d.ex || {})[s.id] : null; }
function status(d, s) {
  if (s.kind === 'defi') return d.defi ? 'ok' : (d.defiT > 0 || d.wins > 0) ? 'prog' : 'none';
  const x = secData(d, s); if (!x) return 'none';
  if (x.p) return 'ok';
  if (Object.values(x.q || {}).some(q => !q.p && q.n >= 3)) return 'stuck';
  return 'prog';
}
function cellTitle(d, s) {
  const x = secData(d, s), qs = x ? Object.values(x.q || {}) : [];
  const st = { none: 'pas commencé', prog: 'en cours', ok: 'réussi', stuck: 'bloqué sur une question' }[status(d, s)];
  let t = `${s.title} — ${st}`;
  if (s.kind === 'defi') t += ` · ${d.wins || 0} mesure(s) réussie(s) · ${fmtDur(d.defiT)}`;
  else if (x) t += ` · ${qs.filter(q => q.f).length}/${qs.filter(q => q.p).length} du premier coup · ${fmtDur(x.t)}`;
  return t;
}

function render() {
  const classes = [...new Set([...ROWS.map(r => r.classe), ...LISTE.map(x => x.classe)].filter(Boolean))].sort();
  m.innerHTML = `<div class="bar">
    <select id="fc" aria-label="Classe"><option value="">Toutes les classes</option>${classes.map(c => `<option${c === UI.classe ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select>
    <select id="fm" aria-label="Leçons"><option value="last"${UI.mode === 'last' ? ' selected' : ''}>Dernière leçon de chaque élève</option><option value="all"${UI.mode === 'all' ? ' selected' : ''}>Toutes les leçons</option></select>
    <input type="search" id="fq" placeholder="Rechercher un élève" value="${esc(UI.q)}" aria-label="Rechercher un élève">
    <span class="sp"></span><span class="upd">Actualisé à ${new Date(lastLoad).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })} · toutes les 30 s</span>
    <button class="btn ghost" id="br">Actualiser</button><button class="btn ghost" id="bx">Exporter (CSV)</button><button class="btn ghost" id="bo">Déconnexion</button></div>
    <div class="tabs" role="tablist">${[['grille', 'Classe'], ['questions', 'Questions'], ['temps', 'Temps']].map(([k, t]) => `<button role="tab" data-t="${k}" aria-selected="${UI.tab === k}">${t}</button>`).join('')}</div>
    <div id="v"></div>`;
  $('#fc').onchange = e => { UI.classe = e.target.value; render(); };
  $('#fm').onchange = e => { UI.mode = e.target.value; render(); };
  $('#fq').oninput = e => { UI.q = e.target.value; const p = e.target.selectionStart; renderView(); };
  $('#br').onclick = () => load(false);
  $('#bx').onclick = exportCSV;
  $('#bo').onclick = () => { sessionStorage.removeItem(PWKEY); localStorage.removeItem(PWKEY); PW = ''; clearTimeout(timer); login(); };
  m.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { UI.tab = b.dataset.t; render(); });
  renderView();
}
function renderView() {
  const v = $('#v'), list = students();
  if (!ROWS.length && !LISTE.length) { v.innerHTML = '<div class="card empty" style="margin-top:12px">Aucun résultat reçu pour l’instant. Les résultats apparaissent ici quelques secondes après qu’un élève a commencé le parcours (connexion nécessaire de son côté).</div>'; return; }
  if (UI.tab === 'grille') return grid(v, list);
  if (UI.tab === 'questions') return questions(v, list);
  return times(v, list);
}

function grid(v, list) {
  const data = withData(list), n = data.length, active = data.filter(e => NOW - (e.d.updated || 0) < 180000).length;
  const stuck = data.filter(e => SECS.some(s => status(e.d, s) === 'stuck')).length;
  const done = data.filter(e => e.d.finished).length;
  const avgSt = n ? (data.reduce((a, e) => a + (e.d.stations || 0), 0) / n).toFixed(1).replace('.', ',') : '0';
  const roster = LISTE.filter(x => !UI.classe || x.classe === UI.classe).length;
  const startedListed = UI.mode === 'last' ? list.filter(e => e.d && e.flag !== 'unlisted').length : 0;
  const classes = [...new Set(LISTE.map(x => x.classe))].sort();
  const perClass = !UI.classe && UI.mode === 'last' && classes.length ? `<div class="legend">${classes.map(c => { const all = list.filter(e => e.classe === c && e.flag !== 'unlisted'); return `<span><b>${esc(c)}</b> : ${all.filter(e => e.d).length} / ${all.length} ont commencé</span>`; }).join('')}</div>` : '';
  v.innerHTML = `<div class="kpis">${roster && UI.mode === 'last' ? `<div class="kpi"><b>${startedListed} / ${roster}</b><span>élèves de la liste ont commencé</span></div>` : `<div class="kpi"><b>${n}</b><span>${UI.mode === 'all' ? 'leçons' : 'élèves'}</span></div>`}<div class="kpi"><b>${active}</b><span>actifs en ce moment (moins de 3 min)</span></div>
    <div class="kpi"><b>${avgSt}</b><span>stations réussies en moyenne (sur 13)</span></div><div class="kpi"><b>${stuck}</b><span>bloqués sur au moins une question</span></div><div class="kpi"><b>${done}</b><span>parcours terminés</span></div></div>
    ${perClass}
    ${!LISTE.length ? '<p class="upd">Astuce : collez vos listes de classe (Classe, Nom, Prénom) dans l’onglet « Liste » de votre feuille Google pour voir aussi les élèves qui n’ont pas encore commencé.</p>' : ''}
    <div class="legend"><span><i style="background:var(--none)"></i>pas commencé</span><span><i style="background:var(--prog-bg);border:1.5px solid var(--prog)"></i>en cours</span><span><i style="background:var(--ok)"></i>réussi</span><span><i style="background:var(--bad)"></i>bloqué (3 essais ou plus sur une question)</span><span>Survolez une case pour le détail ; cliquez sur un nom pour la fiche de l’élève.</span></div>
    ${list.length ? `<div class="wrap"><table><thead><tr><th class="nm">Élève</th>${SECS.map(s => `<th class="sec${s.id === 'defi' || s.id === 'e1' ? ' sep' : ''}" title="${esc(s.title)}">${s.label}</th>`).join('')}<th class="sep">Temps</th><th>1er coup</th><th>Activité</th><th>Fin</th></tr></thead><tbody>
    ${list.map((e, k) => { const d = e.d; return `<tr${d ? '' : ' class="ns"'}><td class="nm">${d ? `<button data-k="${k}">${nameHTML(e)}</button>` : `<span class="nn">${nameHTML(e)}</span>`}<small>${esc(e.classe)}${UI.mode === 'all' && d ? ' · leçon ' + d.n : ''}${noteHTML(e)}</small></td>
      ${SECS.map(s => { const st = d ? status(d, s) : 'none'; return `<td${s.id === 'defi' || s.id === 'e1' ? ' class="sep"' : ''}><span class="c ${st}"${d ? ` title="${esc(cellTitle(d, s))}"` : ''}>${st === 'ok' ? '✓' : st === 'stuck' ? '!' : st === 'prog' ? '…' : ''}</span></td>`; }).join('')}
      <td class="sep">${d ? fmtDur(d.timeTotal) : '—'}</td><td>${d ? (d.firstPct || 0) + ' %' : '—'}</td><td>${d ? (NOW - (d.updated || 0) < 180000 ? '<span class="dot"></span>' : '') + fmtAgo(d.updated) : '—'}</td><td>${d && d.finished ? '✓' : ''}</td></tr>`; }).join('')}
    </tbody></table></div>` : '<div class="card empty">Aucun élève ne correspond au filtre.</div>'}`;
  v.querySelectorAll('[data-k]').forEach(b => b.onclick = () => detail(list[+b.dataset.k]));
}

function questions(v, list) {
  list = withData(list);
  const agg = Object.entries(META.q).map(([key, q]) => {
    const [sec, k] = key.split('|');
    const recs = list.map(e => { const x = secData(e.d, SEC[sec]); return x && x.q && x.q[k]; }).filter(Boolean).filter(x => x.n > 0 || x.p);
    const passed = recs.filter(x => x.p), first = passed.filter(x => x.f).length, stuck = recs.filter(x => !x.p && x.n >= 3).length;
    const errs = {}; recs.forEach(x => (x.e || []).forEach(e => { errs[e] = (errs[e] || 0) + 1; }));
    const top = Object.entries(errs).sort((a, b) => b[1] - a[1]).slice(0, 3);
    return { key, sec, q, n: recs.length, pct: passed.length ? Math.round(100 * first / passed.length) : null, tries: passed.length ? passed.reduce((a, x) => a + x.n, 0) / passed.length : null, stuck, top };
  });
  let rows = agg.filter(a => a.n > 0);
  const dk = a => a.pct ?? (a.stuck ? -1 : 101);
  if (UI.sort === 'diff') rows.sort((a, b) => dk(a) - dk(b) || b.stuck - a.stuck);
  const col = p => p == null ? 'var(--line)' : p >= 75 ? 'var(--ok)' : p >= 50 ? 'var(--prog)' : 'var(--bad)';
  let lastSec = '';
  v.innerHTML = `<div class="bar" style="margin-top:12px"><label>Trier : <select id="so"><option value="ordre"${UI.sort === 'ordre' ? ' selected' : ''}>ordre du parcours</option><option value="diff"${UI.sort === 'diff' ? ' selected' : ''}>les plus difficiles d’abord</option></select></label>
    <span class="upd">Réussite du premier coup, essais moyens et erreurs les plus fréquentes (d’après les messages affichés aux élèves).</span></div>
    ${rows.length ? `<div class="wrap"><table class="qt"><thead><tr><th style="text-align:left">Question</th><th>Élèves</th><th>1er coup</th><th>Essais moyens</th><th>Bloqués</th><th style="text-align:left">Erreurs fréquentes</th></tr></thead><tbody>
    ${rows.map(a => { let h = ''; if (UI.sort === 'ordre' && a.sec !== lastSec) { lastSec = a.sec; h = `<tr><td class="sh" colspan="6">${esc(SEC[a.sec].label)} · ${esc(SEC[a.sec].title)}</td></tr>`; }
      return h + `<tr><td><b>${esc(a.q.app)}</b> — ${esc(a.q.prompt)}${UI.sort === 'diff' ? `<span class="tag">${esc(SEC[a.sec].title)}</span>` : ''}</td><td class="n">${a.n}</td>
        <td class="n">${a.pct == null ? '—' : `<span class="pbar"><i style="width:${a.pct}%;background:${col(a.pct)}"></i></span>${a.pct} %`}</td><td class="n">${a.tries == null ? '—' : a.tries.toFixed(1).replace('.', ',')}</td><td class="n">${a.stuck || ''}</td>
        <td>${a.top.length ? `<ul class="errs">${a.top.map(([e, c]) => `<li>${esc(e)} <b>(${c})</b></li>`).join('')}</ul>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>` : '<div class="card empty">Aucune réponse pour l’instant.</div>'}`;
  $('#so').onchange = e => { UI.sort = e.target.value; questions(v, list); };
}

function times(v, list) {
  list = withData(list);
  const med = a => { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y), k = Math.floor(s.length / 2); return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2; };
  const data = SECS.map(s => {
    const t = list.map(e => s.kind === 'defi' ? e.d.defiT : (secData(e.d, s) || {}).t).filter(x => x > 0);
    const tOk = list.filter(e => status(e.d, s) === 'ok').map(e => s.kind === 'defi' ? e.d.defiT : (secData(e.d, s) || {}).t).filter(x => x > 0);
    return { s, n: t.length, med: med(tOk.length ? tOk : t), est: s.est * 60 };
  });
  const max = Math.max(1, ...data.map(d => Math.max(d.med, d.est)));
  const tot = list.length ? list.reduce((a, e) => a + (e.d.timeTotal || 0), 0) / list.length : 0;
  v.innerHTML = `<div class="kpis"><div class="kpi"><b>${fmtDur(tot)}</b><span>temps de travail moyen par ${UI.mode === 'all' ? 'leçon' : 'élève'}</span></div><div class="kpi"><b>${fmtDur(META.total * 60)}</b><span>durée prévue du chapitre</span></div></div>
    <div class="legend"><span><i style="background:var(--sky)"></i>temps médian des élèves (ceux qui ont réussi la partie)</span><span><i style="background:var(--plum)"></i>durée prévue</span></div>
    <div class="wrap"><table class="qt"><thead><tr><th style="text-align:left">Partie</th><th>Élèves</th><th>Temps médian</th><th>Prévu</th><th style="text-align:left;min-width:220px">Comparaison</th></tr></thead><tbody>
    ${data.map(d => `<tr><td>${esc(d.s.label)} · ${esc(d.s.title)}</td><td class="n">${d.n || ''}</td><td class="n">${d.n ? fmtDur(d.med) : '—'}</td><td class="n">${fmtDur(d.est)}</td>
      <td><div class="tbar"><i style="width:${100 * d.med / max}%"></i><b style="left:${100 * d.est / max}%"></b></div></td></tr>`).join('')}
    </tbody></table></div>`;
}

function detail(e) {
  const d = e.d, dlg = $('#dlg');
  const sec = s => { const x = secData(d, s), st = status(d, s);
    const head = `<h3><span class="c ${st}">${st === 'ok' ? '✓' : st === 'stuck' ? '!' : st === 'prog' ? '…' : ''}</span>${esc(s.label)} · ${esc(s.title)}<span class="tag">${s.kind === 'defi' ? fmtDur(d.defiT) : fmtDur(x && x.t)}</span></h3>`;
    if (s.kind === 'defi') return !(d.wins || d.defiT) ? '' : `<div class="sd">${head}<ul><li>${d.wins || 0} mesure(s) réussie(s) sur 3 demandées</li></ul></div>`;
    if (!x) return '';
    const steps = s.kind === 'st' ? `<li>Observer : ${x.o ? 'fait' : 'non'} · Retenir : ${x.c ? 'fait' : 'non'}</li>` : '';
    const qs = Object.entries(x.q || {}).map(([k, q]) => { const mq = META.q[s.id + '|' + k] || { app: '', prompt: k };
      return `<li>${q.p ? (q.f ? '✓ du premier coup' : `✓ en ${q.n} essais`) : `<b style="color:var(--bad)">${q.n} essai(s), pas encore réussie</b>`}${q.c ? ' · a vu la correction' : ''} — ${esc(mq.app)} : ${esc(mq.prompt)}${q.e && q.e.length ? `<br><small style="color:var(--muted)">Erreurs : ${q.e.map(esc).join(' · ')}</small>` : ''}</li>`; }).join('');
    return `<div class="sd">${head}<ul>${steps}${qs}</ul></div>`; };
  dlg.innerHTML = `<div class="dh"><div><h2>${esc(e.prenom)} ${esc(e.nom)}</h2><span class="upd">${esc(e.classe)}${noteHTML(e).replace(/<[^>]+>/g, '')} · leçon ${d.n} commencée le ${new Date(d.created).toLocaleDateString('fr-FR')} · ${fmtDur(d.timeTotal)} de travail · ${d.firstPct || 0} % du premier coup${d.finished ? ' · parcours terminé' : ''}</span></div><button class="btn ghost" id="dc">Fermer</button></div>
    <div class="db">${SECS.map(sec).join('') || '<p class="empty">Rien de commencé pour l’instant.</p>'}</div>`;
  $('#dc').onclick = () => dlg.close();
  dlg.showModal();
}

function exportCSV() {
  const list = students();
  const head = ['Classe', 'Nom', 'Prénom', 'Leçon', ...SECS.map(s => s.label + ' ' + s.title), 'Stations réussies', 'Exercices terminés', 'Temps (min)', 'Premier coup (%)', 'Dernière activité', 'Terminé', 'Remarque'];
  const lab = { none: '', prog: 'en cours', ok: 'réussi', stuck: 'bloqué' };
  const rem = e => e.flag === 'fuzzy' ? 'a écrit « ' + e.typed + ' »' : e.flag === 'other' ? 'a choisi ' + e.typedClasse : e.flag === 'unlisted' ? 'absent de la liste' : e.flag === 'none' ? 'pas encore connecté' : '';
  const lines = [head, ...list.map(e => { const d = e.d || {}; return [e.classe, e.nom, e.prenom, d.n || '', ...SECS.map(s => e.d ? lab[status(d, s)] : ''), d.stations || 0, d.exercises || 0, Math.round((d.timeTotal || 0) / 60), d.firstPct || 0, d.updated ? new Date(d.updated).toLocaleString('fr-FR') : '', d.finished ? 'oui' : 'non', rem(e)]; })];
  const csv = '\ufeff' + lines.map(l => l.map(x => { const s = String(x); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'tableau_de_bord_chapitre6_' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && PW && SYNC_URL && Date.now() - lastLoad > 30000) load(false); });
if (!SYNC_URL) setup(); else if (PW) load(true); else login();
</script>
</body>
</html>
